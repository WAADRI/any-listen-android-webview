name: gen-keystore

# 一次性工具工作流：生成正式签名用的 keystore。
# 本机无 JDK，故借 CI 的 JDK 生成；生成后立刻下载并配置为 Secrets，随后删除本文件。
# 注意：keystore 只用 artifact 传递，不打印到日志。

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'keystore 密码（storepass 与 keypass 相同）'
        required: true

permissions:
  contents: read

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        env:
          PASSWORD: ${{ inputs.password }}
        run: |
          set -euo pipefail
          echo "::add-mask::$PASSWORD"
          keytool -genkeypair -v \
            -keystore anylisten.jks \
            -storetype PKCS12 \
            -alias anylisten \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass "$PASSWORD" \
            -keypass "$PASSWORD" \
            -dname "CN=AnyListen, OU=Mobile, O=AnyListen, L=Beijing, ST=Beijing, C=CN"
          echo "--- keystore info ---"
          keytool -list -keystore anylisten.jks -storepass "$PASSWORD"

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: anylisten.jks
          if-no-files-found: error
